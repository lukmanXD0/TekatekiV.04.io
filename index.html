<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 10MinuteMail - OTP Auto Detector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .email-box {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #eee;
        }
        .email-address {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .email-text {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            background: white;
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid #667eea;
            min-width: 300px;
            word-break: break-all;
        }
        .btn-new {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1em;
            transition: all 0.3s;
        }
        .btn-new:hover { background: #ff5252; transform: scale(1.05); }
        .countdown {
            text-align: center;
            font-size: 1.2em;
            color: #666;
        }
        .messages { padding: 30px; }
        .messages h3 { margin-bottom: 20px; color: #333; }
        .messages-list {
            max-height: 400px;
            overflow-y: auto;
        }
        .message-item {
            background: white;
            border: 1px solid #eee;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: all 0.3s;
        }
        .message-item.new {
            border-left: 5px solid #4CAF50;
            animation: bounce 0.5s;
            background: #e8f5e8;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .message-subject { font-weight: bold; color: #333; }
        .message-time { font-size: 0.9em; color: #666; }
        .message-body {
            color: #555;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .otp-detector {
            padding: 30px;
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            text-align: center;
        }
        .otp-box {
            background: rgba(255,255,255,0.2);
            border-radius: 15px;
            padding: 30px;
            margin-top: 15px;
            font-size: 1.5em;
            font-weight: bold;
            border: 3px solid rgba(255,255,255,0.3);
        }
        .no-messages, .no-otp { color: #999; font-style: italic; }
        .copy-btn {
            background: #ffeb3b !important;
            color: #333 !important;
            border: none !important;
            padding: 10px 20px !important;
            border-radius: 25px !important;
            cursor: pointer !important;
            font-weight: bold !important;
            margin-top: 10px;
        }
        @media (max-width: 768px) {
            .email-text { min-width: 250px; font-size: 1.1em; }
            .email-address { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📧 10MinuteMail PRO</h1>
            <p>Auto OTP Receiver • Refresh 5 detik • 100% Work</p>
        </div>

        <div class="email-box">
            <div class="email-address">
                <strong>Email:</strong> 
                <span id="currentEmail" class="email-text">Loading...</span>
                <button id="newEmailBtn" class="btn-new">🔄 Email Baru</button>
            </div>
            <div class="countdown">
                <span>Sisa waktu: <span id="countdown">10:00</span></span>
            </div>
        </div>

        <div class="messages">
            <h3>📥 Semua Pesan (OTP)</h3>
            <div id="messagesList" class="messages-list">
                <div class="no-messages">⏳ Menunggu email baru...</div>
            </div>
        </div>

        <div class="otp-detector">
            <h3>🎯 OTP TERBARU</h3>
            <div id="latestOtp" class="otp-box">
                <span class="no-otp">Belum ada OTP • Auto detect 4-8 digit</span>
            </div>
        </div>
    </div>

    <script>
        class TempMail {
            constructor() {
                this.currentEmail = '';
                this.messages = [];
                this.countdown = 600;
                this.init();
            }

            init() {
                this.generateEmail();
                this.startCountdown();
                this.startAutoRefresh();
                document.getElementById('newEmailBtn').onclick = () => this.generateEmail();
                
                // Notification permission
                if (Notification.permission === 'default') {
                    Notification.requestPermission();
                }
            }

            generateEmail() {
                const domains = ['@1secmail.com','@si Tempmail.com','@guerrillamail.com','@yopmail.com','@sharklasers.com'];
                const username = this.randomString(8);
                this.currentEmail = username + domains[Math.floor(Math.random() * domains.length)];
                
                document.getElementById('currentEmail').textContent = this.currentEmail;
                document.getElementById('messagesList').innerHTML = '<div class="no-messages">⏳ Menunggu email baru...</div>';
                document.getElementById('latestOtp').innerHTML = '<span class="no-otp">Belum ada OTP</span>';
                
                this.messages = [];
                this.resetCountdown();
            }

            randomString(length) {
                const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
                let result = '';
                for (let i = 0; i < length; i++) {
                    result += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return result;
            }

            async checkEmails() {
                try {
                    const [username, domain] = this.currentEmail.split('@');
                    const response = await fetch(`https://www.1secmail.com/api/v1/?action=getMessages&login=${username}&domain=${domain}`);
                    const data = await response.json();
                    
                    if (data && data.length > 0) {
                        await this.loadMessageDetails(data[0].id);
                    }
                } catch (e) {
                    console.log('Check error:', e);
                }
            }

            async loadMessageDetails(id) {
                try {
                    const [username, domain] = this.currentEmail.split('@');
                    const response = await fetch(`https://www.1secmail.com/api/v1/?action=readMessage&login=${username}&domain=${domain}&id=${id}`);
                    const message = await response.json();
                    
                    if (message && !this.messages.find(m => m.id == message.id)) {
                        this.messages.unshift({
                            id: message.id,
                            from: message.from,
                            subject: message.subject,
                            textBody: message.textBody || message.htmlBody,
                            date: new Date(message.date).toLocaleString('id-ID')
                        });
                        
                        this.displayMessages();
                        this.extractOTP(message.textBody || message.htmlBody);
                    }
                } catch (e) {
                    console.log('Load error:', e);
                }
            }

            displayMessages() {
                const container = document.getElementById('messagesList');
                if (!this.messages.length) {
                    container.innerHTML = '<div class="no-messages">⏳ Menunggu email baru...</div>';
                    return;
                }

                container.innerHTML = this.messages.map(msg => `
                    <div class="message-item" data-id="${msg.id}">
                        <div class="message-header">
                            <span class="message-subject">${msg.subject || 'No Subject'}</span>
                            <span class="message-time">${msg.date}</span>
                        </div>
                        <div class="message-body">${this.formatBody(msg.textBody)}</div>
                    </div>
                `).join('');
            }

            formatBody(body) {
                return (body || '')
                    .replace(/\n/g, '<br>')
                    .replace(/https?:\/\/[^\s<]+/g, '<a href="$&" target="_blank" style="color:#667eea;">Link</a>')
                    .substring(0, 300) + (body.length > 300 ? '...' : '');
            }

            extractOTP(body) {
                const patterns = [
                    /(\b\d{4,8}\b)/g,
                    /OTP[:\s]*(\d{4,8})/gi,
                    /code[:\s]*(\d{4,8})/gi,
                    /pin[:\s]*(\d{4,8})/gi,
                    /verification[:\s]*(\d{4,8})/gi
                ];

                for (const pattern of patterns) {
                    const match = body.match(pattern);
                    if (match) {
                        this.displayOTP(match[1]);
                        return;
                    }
                }
            }

            displayOTP(otp) {
                const otpBox = document.getElementById('latestOtp');
                otpBox.innerHTML = `
                    <div style="font-size:2.2em;margin-bottom:15px;color:#ffeb3b;">🔥 ${otp} 🔥</div>
                    <button class="copy-btn" onclick="navigator.clipboard.writeText('${otp}').then(()=>alert('✅ OTP ${otp} DI-COPY!'))">
                        📋 COPY OTP
                    </button>
                `;
                otpBox.style.background = 'rgba(255,235,59,0.4)';
                
                // Sound notification (beep)
                const audio = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAo');
                audio.play().catch(() => {});
                
                // Browser notification
                if (Notification.permission === 'granted') {
                    new Notification('🎉 OTP DITEMUKAN!', { 
                        body: `Kode: ${otp} | Email: ${this.currentEmail}`,
                        icon: 'https://img.icons8.com/emoji/48/000000/inbox-tray.png'
                    });
                }
            }

            startAutoRefresh() {
                setInterval(() => this.checkEmails(), 5000);
            }

            startCountdown() {
                clearInterval(this.countdownInterval);
                this.countdownInterval = setInterval(() => {
                    this.countdown--;
                    const m = Math.floor(this.countdown / 60);
                    const s = this.countdown % 60;
                    document.getElementById('countdown').textContent = `${m}:${s.toString().padStart(2,'0')}`;
                    
                    if (this.countdown <= 0) {
                        alert('⏰ 10 MENIT HABIS! Generate email baru');
                        this.generateEmail();
                    }
                }, 1000);
            }

            resetCountdown() {
                this.countdown = 600;
                this.startCountdown();
            }
        }

        // START APP
        document.addEventListener('DOMContentLoaded', () => new TempMail());
    </script>
</body>
</html>
